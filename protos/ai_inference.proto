syntax = "proto3";

package aiinference;

// =====================
// 1. Unary RPC (Sentiment Analysis)
// =====================
message SentimentRequest {
  string text = 1;
}

message SentimentResponse {
  string label = 1;
  float confidence = 2;
}

// =====================
// 2. Server Streaming (Text Generation)
// =====================
message GenerateRequest {
  string prompt = 1;
}

message GenerateResponse {
  string token = 1;
}

// =====================
// 3. Client Streaming (Summarization)
// =====================
message TextChunk {
  string text = 1;
}

message SummaryResponse {
  string summary = 1;
}

// =====================
// 4. Bidirectional Streaming (Chat)
// =====================
message ChatMessage {
  string user = 1;
  string message = 2;
}

// =====================
// SERVICE DEFINITION
// =====================
service AIInference {

  // Unary RPC
  rpc AnalyzeSentiment(SentimentRequest) returns (SentimentResponse);

  // Server Streaming
  rpc GenerateText(GenerateRequest) returns (stream GenerateResponse);

  // Client Streaming
  rpc SummarizeBatch(stream TextChunk) returns (SummaryResponse);

  // Bidirectional Streaming
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}