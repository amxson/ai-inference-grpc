services:
  ai-server-1:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=50051
      - GRPC_HOST=0.0.0.0
      - GRPC_API_TOKEN=${GRPC_API_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}

  ai-server-2:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=50051
      - GRPC_HOST=0.0.0.0
      - GRPC_API_TOKEN=${GRPC_API_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}

  ai-server-3:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=50051
      - GRPC_HOST=0.0.0.0
      - GRPC_API_TOKEN=${GRPC_API_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ai-server-1
      - ai-server-2
      - ai-server-3