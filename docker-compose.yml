services:
  ai-server-1:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=50051

  ai-server-2:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=50051

  ai-server-3:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=50051

  nginx:
    image: nginx:1.25
    ports:
      - "50051:50051"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ai-server-1
      - ai-server-2
      - ai-server-3